name: fakenews
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy<2.1
  - pandas>=2.0
  - scikit-learn>=1.3
  - pytorch>=2.6        # CPU build by default; see README for the CUDA variant
  - matplotlib
  - seaborn
  - pyyaml
  - joblib
  - pytest
  - jupyter
  - pip:
      - streamlit>=1.30
      - transformers>=4.38   # only needed for the optional BERT extension
